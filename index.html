<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Traffic Battle</title>
    <meta name="description" content="Dodge the oncoming traffic in a three-lane endless driving game.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
    <link rel="stylesheet" href="style/style.css">
    <script src="scripts/game.js" defer></script>
</head>
<body>
    <main class="frame">
        <header class="panel panel--top">
            <h1>Traffic Battle</h1>
        </header>

        <div class="stage" id="stage">
            <div class="viewport" id="viewport">
                <div class="game" id="game">
                    <div class="road-line road-line--upper"></div>
                    <div class="road-line road-line--lower"></div>

                    <img class="tree tree--top" style="--delay: 0s" src="static/tree.png" alt="">
                    <img class="tree tree--top" style="--delay: -0.35s" src="static/tree.png" alt="">
                    <img class="tree tree--top" style="--delay: -0.7s" src="static/tree.png" alt="">
                    <img class="tree tree--bottom" style="--delay: -0.17s" src="static/tree.png" alt="">
                    <img class="tree tree--bottom" style="--delay: -0.52s" src="static/tree.png" alt="">
                    <img class="tree tree--bottom" style="--delay: -0.87s" src="static/tree.png" alt="">

                    <img class="car player" id="player" src="static/car3.png" alt="Your car">
                    <img class="car traffic" id="traffic" src="static/car2.png" alt="Oncoming car">
                </div>

                <div class="overlay" id="overlay">
                    <p class="overlay__title" id="overlay-title">Ready?</p>
                    <button class="play" id="play" type="button">Play</button>
                    <p class="overlay__hint">Use ↑ and ↓, or tap above or below your car, to change lane</p>
                </div>
            </div>
        </div>

        <footer class="panel panel--bottom">
            <p class="score" id="score">Score: 0</p>
            <p class="score" id="high-score">High Score: -</p>
        </footer>
    </main>
</body>
</html>
